name: Bootstrap assets & splash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SVG tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Add dependencies
        run: |
          npm install
          npm install @capacitor/splash-screen
          npm install --save-dev @capacitor/assets

      - name: Generate icon + splash PNGs from SVG
        run: |
          set -e
          mkdir -p resources
          if [ -f resources/icon.svg ]; then
            rsvg-convert -w 1024 -h 1024 \
              --background-color=#0d0d1a \
              resources/icon.svg -o resources/icon.png
            echo "→ icon.png generated"
          else
            echo "! resources/icon.svg not found, skipping"
          fi
          if [ -f resources/splash.svg ]; then
            rsvg-convert -w 2732 -h 2732 \
              --background-color=#0d0d1a \
              resources/splash.svg -o resources/splash.png
            echo "→ splash.png generated"
          fi
          rm -f resources/icon-foreground.png resources/icon-background.png
          ls -lh resources/

      - name: Clean old generated resources
        run: |
          find android/app/src/main/res -type f \
            \( -name "ic_launcher*.png" \
            -o -name "ic_launcher*.xml" \
            -o -name "splash.png" \) \
            -delete
          find android/app/src/main/res -type d -empty -delete
          echo "Remaining res tree:"
          find android/app/src/main/res -type d | sort

      - name: Build web assets
        run: npm run build

      - name: Generate Android resources
        run: npx @capacitor/assets generate --android

      - name: Verify icons
        run: |
          echo "── mipmap-xxxhdpi ──"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ || echo "(none)"
          echo "── mipmap-anydpi-v26 ──"
          ls -la android/app/src/main/res/mipmap-anydpi-v26/ || echo "(none)"
          echo "── resources ──"
          ls -la resources/

      - name: Sync Capacitor
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "! android/ not present, skipping sync"
          fi

      - name: Commit everything back
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A package.json package-lock.json
          git add -A android/app/src/main/res 2>/dev/null || true
          git add -A android/app/src/main/assets/capacitor.plugins.json 2>/dev/null || true
          git add -A resources 2>/dev/null || true
          git commit -m "bootstrap: splash-screen plugin + generated assets" || echo "nothing to commit"
          git push
