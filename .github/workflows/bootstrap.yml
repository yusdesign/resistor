name: Bootstrap android platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: |
          npm install
          npm install --no-save @capacitor/cli@^6

      - name: Build web assets
        run: npm run build

      - name: Add android
        run: npx cap add android

      - name: Verify wrapper exists
        run: |
          ls -la android/gradlew
          ls -la android/gradle/wrapper/gradle-wrapper.jar

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A android
          git commit -m "bootstrap: android platform with gradle wrapper" || echo "nothing"
          git push
