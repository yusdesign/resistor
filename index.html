<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resistor · Резистор</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!-- ─── SVG SPRITE (INLINE) ─── -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="play-icon" viewBox="0 0 24 24">
      <rect x="2.9091" y="2.9091" width="18.182" height="18.182" rx="1.0909" ry="1.0909" style="fill:none;stroke-linejoin:round;stroke-miterlimit:0;stroke-width:2;stroke:var(--text)"/>
      <path d="m 9.2920256,8.0000997 6.2905054,4.0000003 -6.2905054,4 z" style="fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:0"/>
    </symbol>
    <symbol id="pause-icon" viewBox="0 0 24 24">
      <rect x="2.9091" y="2.9091" width="18.182" height="18.182" rx="1.0909" ry="1.0909" style="fill:none;stroke-linejoin:round;stroke-miterlimit:0;stroke-width:2;stroke:var(--text)"/>
      <path d="M 10.041646,8.0000997 V 16.0001 Z" style="fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:0"/>
      <path d="M 14.081264,8.0000997 V 16.0001 Z" style="fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:0"/>
    </symbol>
    <symbol id="lyrics-icon" viewBox="0 0 24 24">
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:0;stroke-opacity:1" d="m 6,6 1,3 c 0,0 -1,2 -1,4 0,3 2,4 6,4 4,0 6,-1 6,-4 0,-2 -1,-4 -1,-4 l 1,-3"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:butt;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 9.5,19 V 5"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:butt;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 12,20 V 4"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:butt;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 14.5,19 V 5"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:butt;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 5.0576687,9 H 19"/>
    </symbol>
    <symbol id="tracklist-icon" viewBox="0 0 24 24">
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:square;stroke-linejoin:bevel;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 9,19 V 5"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:square;stroke-linejoin:bevel;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 19,15 H 5"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 5,17 5,7 A 2,2 135 0 1 7,5 l 10,0 a 2,2 45 0 1 2,2 l 0,10 a 2,2 135 0 1 -2,2 L 7,19 A 2,2 45 0 1 5,17 Z"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:square;stroke-linejoin:bevel;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 19,11.5 H 5"/>
      <path style="opacity:1;fill:none;stroke:var(--text);stroke-width:1;stroke-linecap:square;stroke-linejoin:bevel;stroke-miterlimit:0;stroke-dasharray:none;stroke-opacity:1" d="M 19,8 H 5"/>
    </symbol>
    <symbol id="social-icon" viewBox="0 0 20 20">
      <path fill="none" stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" d="M12.5 6.667a4.167 4.167 0 1 0-8.334 0 4.167 4.167 0 0 0 8.334 0"/>
      <path fill="none" stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" d="M2.5 16.667a5.833 5.833 0 0 1 8.75-5.053m3.837.474.513 1.035c.07.144.257.282.414.309l.93.155c.596.1.736.536.307.965l-.723.73a.64.64 0 0 0-.152.531l.207.903c.164.715-.213.991-.84.618l-.872-.52a.63.63 0 0 0-.577 0l-.872.52c-.624.373-1.003.094-.84-.618l.207-.903a.64.64 0 0 0-.152-.532l-.723-.729c-.426-.43-.289-.864.306-.964l.93-.156a.64.64 0 0 0 .412-.31l.513-1.034c.28-.562.735-.562 1.012 0"/>
    </symbol>
    <symbol id="documentation-icon" viewBox="0 0 21 20">
      <path fill="none" stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" d="m15.5 13.333 1.533 1.322c.645.555.967.833.967 1.178s-.322.623-.967 1.179L15.5 18.333m-3.333-5-1.534 1.322c-.644.555-.966.833-.966 1.178s.322.623.966 1.179l1.534 1.321"/>
      <path fill="none" stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" d="M17.167 10.836v-4.32c0-1.41 0-2.117-.224-2.68-.359-.906-1.118-1.621-2.08-1.96-.599-.21-1.349-.21-2.848-.21-2.623 0-3.935 0-4.983.369-1.684.591-3.013 1.842-3.641 3.428C3 6.449 3 7.684 3 10.154v2.122c0 2.558 0 3.838.706 4.726q.306.383.713.671c.76.536 1.79.64 3.581.66"/>
      <path fill="none" stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" d="M3 10a2.78 2.78 0 0 1 2.778-2.778c.555 0 1.209.097 1.748-.047.48-.129.854-.503.982-.982.145-.54.048-1.194.048-1.749a2.78 2.78 0 0 1 2.777-2.777"/>
    </symbol>
    <symbol id="close-icon" viewBox="0 0 24 24">
      <rect x="2.9091" y="2.9091" width="18.182" height="18.182" rx="1.0909" ry="1.0909" style="fill:none;stroke:var(--text);stroke-linejoin:round;stroke-miterlimit:0;stroke-width:2"/>
      <path d="m8 8 8 8" style="fill:none;stroke:var(--text);stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:0;stroke-width:2"/>
      <path d="m16 8-8 8" style="fill:none;stroke:var(--text);stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:0;stroke-width:2"/>
    </symbol>
    <symbol id="settings-icon" viewBox="0 0 24 24">
      <path id="path1" style="opacity:1;fill:var(--text);stroke:none;" d="m 5,16.043457 7,4.040039 7,-4.040039 V 7.9565429 L 12,3.916504 5,7.9565429 Z M 6.2270704,12.000993 9.114395,7 14.886355,7.0006869 17.772929,11.999007 14.885605,17 9.1136453,16.999313 Z" />
    </symbol>
  </svg>

  <div class="player" id="app">
    <div class="header">
      <h1><svg viewBox="0 0 24 24"><use href="#resistor-icon"/></svg> Resistor</h1>
      <div class="header-actions">
        <button class="icon-btn" id="tracklistToggle" title="Tracklist" aria-label="Toggle tracklist">
          <svg viewBox="0 0 24 24"><use href="#tracklist-icon"/></svg>
        </button>
        <button class="icon-btn" id="settingsToggle" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24"><use href="#settings-icon"/></svg>
        </button>
      </div>
    </div>

    <span class="artwork" id="artworkIcon">
      <img src="data:image/png;base64,…" alt="Resistor" />
    </span>

    <div class="now-playing" id="nowPlaying" title="Click to copy track info">
      <h2 id="title">Resistor</h2>
      <p class="artist" id="artist">SomaFM Indie Pop</p>
    </div>

    <button class="play-btn" id="playBtn" aria-label="Play / Pause">
      <svg viewBox="0 0 24 24"><use href="#play-icon"/></svg>
    </button>

    <div class="controls-bar">
      <button class="icon-btn" id="showLyricsBtn" title="Show Lyrics" aria-label="Show lyrics">
        <svg viewBox="0 0 24 24"><use href="#lyrics-icon"/></svg>
      </button>
      <button class="icon-btn" id="toggleDedicationBtn" title="Elise Mode" aria-label="Toggle Elise Mode">
        <svg viewBox="0 0 24 24"><use href="#social-icon"/></svg>
      </button>
    </div>

    <div class="station-info">
      <span class="badge" id="stationBadge">SomaFM</span>
      <span class="badge accent">32k AAC</span>
      <span class="badge playing-badge" id="liveBadge">● Live</span>
    </div>

    <div class="status" id="status">Ready to play</div>

    <div class="volume-wrap">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>

    <div class="lyrics-panel" id="lyricsPanel">
      <div class="header">
        <span>📜 Lyrics</span>
        <button class="icon-btn" id="closeLyrics" aria-label="Close lyrics">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><use href="#close-icon"/></svg>
        </button>
      </div>
      <div class="content" id="lyricsContent">
        <p style="color: var(--muted);">🎵 Play a track to see lyrics.</p>
      </div>
    </div>

    <div class="tracklist-section">
      <div class="tracklist-header" id="tracklistHeader">
        <span>📋 Tracklist (<span id="trackCount">0</span>)</span>
        <span class="arrow" id="tracklistArrow">▼</span>
      </div>
      <div class="tracklist-items" id="tracklistItems"></div>
    </div>
  </div>

  <div class="settings-overlay" id="settingsModal">
    <div class="settings-modal">
      <h3>⚙️ Settings</h3>
      <div class="setting-row">
        <label for="darkModeToggle">🌙 Dark Mode</label>
        <input type="checkbox" id="darkModeToggle" checked>
      </div>
      <div class="setting-row">
        <label for="bufferSize">⏳ Buffer Size</label>
        <input type="range" id="bufferSize" min="10" max="120" value="30">
        <span class="range-value" id="bufferLabel">30s</span>
      </div>
      <div class="setting-row">
        <label for="autoReconnectToggle">🔄 Auto-Reconnect</label>
        <input type="checkbox" id="autoReconnectToggle" checked>
      </div>
      <div class="setting-row">
        <label for="eliseModeToggle">❤️ Elise Mode</label>
        <input type="checkbox" id="eliseModeToggle">
      </div>
      <button class="settings-close-btn" id="closeSettings">Close</button>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
