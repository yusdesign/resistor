<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resistor · Резистор</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- ─── SVG SPRITE (INLINE) ─── -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="play-icon" viewBox="0 0 24 24">…</symbol>
    <symbol id="pause-icon" viewBox="0 0 24 24">…</symbol>
    <symbol id="lyrics-icon" viewBox="0 0 24 24">…</symbol>
    <symbol id="tracklist-icon" viewBox="0 0 24 24">…</symbol>
    <symbol id="social-icon" viewBox="0 0 20 20">…</symbol>
    <symbol id="documentation-icon" viewBox="0 0 21 20">…</symbol>
    <symbol id="close-icon" viewBox="0 0 24 24">…</symbol>
    <symbol id="settings-icon" viewBox="0 0 24 24">…</symbol>
  </svg>

  <div class="player" id="app">
    <div class="header">
      <h1><svg viewBox="0 0 24 24"><use href="#resistor-icon"/></svg> Resistor</h1>
      <div class="header-actions">
        <button class="icon-btn" id="tracklistToggle" title="Tracklist" aria-label="Toggle tracklist">
          <svg viewBox="0 0 24 24"><use href="#tracklist-icon"/></svg>
        </button>
        <button class="icon-btn" id="settingsToggle" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24"><use href="#settings-icon"/></svg>
        </button>
      </div>
    </div>

    <span class="artwork" id="artworkIcon">
      <img src="data:image/png;base64,…" alt="Resistor" />
    </span>

    <div class="now-playing" id="nowPlaying" title="Click to copy track info">
      <h2 id="title">Resistor</h2>
      <p class="artist" id="artist">SomaFM Indie Pop</p>
    </div>

    <button class="play-btn" id="playBtn" aria-label="Play / Pause">
      <svg viewBox="0 0 24 24"><use href="#play-icon"/></svg>
    </button>

    <div class="controls-bar">
      <button class="icon-btn" id="showLyricsBtn" title="Show Lyrics" aria-label="Show lyrics">
        <svg viewBox="0 0 24 24"><use href="#lyrics-icon"/></svg>
      </button>
      <button class="icon-btn" id="toggleDedicationBtn" title="Elise Mode" aria-label="Toggle Elise Mode">
        <svg viewBox="0 0 24 24"><use href="#social-icon"/></svg>
      </button>
    </div>

    <div class="station-info">
      <span class="badge" id="stationBadge">SomaFM</span>
      <span class="badge accent">32k AAC</span>
      <span class="badge playing-badge" id="liveBadge">● Live</span>
    </div>

    <div class="status" id="status">Ready to play</div>

    <div class="volume-wrap">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>

    <div class="lyrics-panel" id="lyricsPanel">
      <div class="header">
        <span>📜 Lyrics</span>
        <button class="icon-btn" id="closeLyrics" aria-label="Close lyrics">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><use href="#close-icon"/></svg>
        </button>
      </div>
      <div class="content" id="lyricsContent">
        <p style="color: var(--muted);">🎵 Play a track to see lyrics.</p>
      </div>
    </div>

    <div class="tracklist-section">
      <div class="tracklist-header" id="tracklistHeader">
        <span>📋 Tracklist (<span id="trackCount">0</span>)</span>
        <span class="arrow" id="tracklistArrow">▼</span>
      </div>
      <div class="tracklist-items" id="tracklistItems"></div>
    </div>
  </div>

  <div class="settings-overlay" id="settingsModal">
    <div class="settings-modal">
      <h3>⚙️ Settings</h3>
      <div class="setting-row">
        <label for="darkModeToggle">🌙 Dark Mode</label>
        <input type="checkbox" id="darkModeToggle" checked>
      </div>
      <div class="setting-row">
        <label for="bufferSize">⏳ Buffer Size</label>
        <input type="range" id="bufferSize" min="10" max="120" value="30">
        <span class="range-value" id="bufferLabel">30s</span>
      </div>
      <div class="setting-row">
        <label for="autoReconnectToggle">🔄 Auto-Reconnect</label>
        <input type="checkbox" id="autoReconnectToggle" checked>
      </div>
      <div class="setting-row">
        <label for="eliseModeToggle">❤️ Elise Mode</label>
        <input type="checkbox" id="eliseModeToggle">
      </div>
      <button class="settings-close-btn" id="closeSettings">Close</button>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
