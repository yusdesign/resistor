<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resistor · Верста</title>
  <style>
    /* ─── RESET & ROOT ─── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d1a;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --text: #fff;
      --muted: #888;
      --accent: #ff6b6b;
      --playing: #4ecdc4;
      --surface: #1a1a2e;
      --shadow: rgba(0,0,0,0.8);
      --input-bg: rgba(255,255,255,0.1);
      --radius: 2px;
      --font: -apple-system, system-ui, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f0f0f5;
      --card: rgba(255,255,255,0.6);
      --border: rgba(0,0,0,0.08);
      --text: #1a1a2e;
      --muted: #666;
      --surface: #ffffff;
      --shadow: rgba(0,0,0,0.1);
      --input-bg: rgba(0,0,0,0.05);
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: var(--font);
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.3s, color 0.3s;
      color: var(--text);
    }
    .player {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px var(--shadow);
      transition: background 0.3s, box-shadow 0.3s;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .header-actions span {
      cursor: pointer;
      font-size: 20px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .header-actions span:hover { opacity: 1; }
    .artwork {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }
    .now-playing {
      margin-bottom: 16px;
      min-height: 72px;
      cursor: pointer;
    }
    .now-playing h2 {
      font-size: 20px;
      font-weight: 600;
      min-height: 28px;
      margin-bottom: 4px;
      transition: color 0.3s;
    }
    .now-playing .artist {
      color: var(--muted);
      font-size: 14px;
      transition: color 0.3s;
    }
    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 12px 0 8px;
      flex-wrap: wrap;
    }
    .control-btn {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s, transform 0.15s;
      color: var(--text);
      padding: 4px;
      line-height: 1;
    }
    .control-btn:hover { opacity: 0.9; }
    .control-btn:active { transform: scale(0.9); }
    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50% !important;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 20px rgba(255,107,107,0.3);
      touch-action: manipulation;
      margin: 4px auto 8px;
    }
    .play-btn:hover { transform: scale(1.05); }
    .play-btn:active { transform: scale(0.92); }
    .play-btn.playing {
      background: var(--playing);
      box-shadow: 0 4px 20px rgba(78,205,196,0.3);
    }
    .station-info {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      padding: 4px 14px;
      border-radius: var(--radius);
      font-size: 11px;
      transition: background 0.2s, color 0.3s;
      border: 1px solid transparent;
    }
    .badge.accent {
      background: rgba(255,107,107,0.12);
      color: var(--accent);
      border-color: rgba(255,107,107,0.1);
    }
    .badge.playing-badge {
      background: rgba(78,205,196,0.12);
      color: var(--playing);
      border-color: rgba(78,205,196,0.1);
    }
    .status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      min-height: 18px;
      transition: color 0.3s;
    }
    .status.error { color: var(--accent); }
    .status.playing { color: var(--playing); }
    .status.buffering { color: #f9a825; }
    .volume-wrap {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .volume-wrap:hover { opacity: 0.8; }
    .volume-wrap input[type="range"] {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      background: var(--input-bg);
      border-radius: var(--radius);
      outline: none;
    }
    .volume-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .volume-icon {
      color: var(--muted);
      font-size: 16px;
      width: 20px;
    }
    .lyrics-panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-top: 14px;
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
    }
    .lyrics-panel .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .lyrics-panel .content {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }
    .lyrics-panel .content .line {
      display: block;
      padding: 1px 0;
    }
    .tracklist-section {
      margin-top: 14px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .tracklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      transition: color 0.2s;
    }
    .tracklist-header:hover { color: var(--text); }
    .tracklist-header .arrow { transition: transform 0.3s; }
    .tracklist-header .arrow.open { transform: rotate(180deg); }
    .tracklist-items {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .tracklist-items.open {
      max-height: 300px;
      opacity: 1;
      overflow-y: auto;
    }
    .tracklist-items .track-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .tracklist-items .track-item .count {
      color: var(--accent);
      font-size: 11px;
      background: rgba(255,107,107,0.08);
      padding: 0 8px;
      border-radius: var(--radius);
    }
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .settings-overlay.open { display: flex; }
    .settings-modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 60px var(--shadow);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    .settings-modal h3 {
      font-size: 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    .settings-modal .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-modal .setting-row:last-child { border-bottom: none; }
    .settings-modal .setting-row label {
      font-size: 14px;
      cursor: pointer;
    }
    .settings-modal input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .settings-modal input[type="range"] {
      width: 100px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .settings-modal .range-value {
      font-size: 13px;
      color: var(--muted);
      min-width: 30px;
      text-align: right;
    }
    .settings-close-btn {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .settings-close-btn:hover { opacity: 0.8; }
    @media (max-width: 400px) {
      .player { padding: 20px 16px; }
      .artwork { font-size: 40px; }
      .now-playing h2 { font-size: 17px; }
      .play-btn { width: 64px; height: 64px; font-size: 28px; }
      .controls-bar { gap: 12px; }
      .control-btn { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="player" id="app">
    <div class="header">
      <h1>🎸 Resistor</h1>
      <div class="header-actions">
        <span id="tracklistToggle" title="Tracklist">📋</span>
        <span id="settingsToggle" title="Settings">⚙️</span>
      </div>
    </div>

    <span class="artwork" id="artworkIcon" aria-hidden="true">🎸</span>

    <div class="now-playing" id="nowPlaying" title="Click to copy track info">
      <h2 id="title">Resistor</h2>
      <p class="artist" id="artist">SomaFM Indie Pop</p>
    </div>

    <button class="play-btn" id="playBtn" aria-label="Play / Pause">▶</button>

    <div class="controls-bar">
      <button id="showLyricsBtn" class="control-btn" title="Show Lyrics">📜</button>
    </div>

    <div class="station-info">
      <span class="badge" id="stationBadge">SomaFM</span>
      <span class="badge accent">32k AAC</span>
      <span class="badge playing-badge" id="liveBadge">● Live</span>
    </div>

    <div class="status" id="status">Ready to play</div>

    <div class="volume-wrap">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>

    <div class="lyrics-panel" id="lyricsPanel">
      <div class="header">
        <span>📜 Lyrics</span>
        <span id="closeLyrics" style="cursor:pointer; font-size:16px;">✕</span>
      </div>
      <div class="content" id="lyricsContent">
        <p style="color: var(--muted);">🎵 Play a track to see lyrics.</p>
      </div>
    </div>

    <div class="tracklist-section">
      <div class="tracklist-header" id="tracklistHeader">
        <span>📋 Tracklist (<span id="trackCount">0</span>)</span>
        <span class="arrow" id="tracklistArrow">▼</span>
      </div>
      <div class="tracklist-items" id="tracklistItems"></div>
    </div>
  </div>

  <div class="settings-overlay" id="settingsModal">
    <div class="settings-modal">
      <h3>⚙️ Settings</h3>
      <div class="setting-row">
        <label for="darkModeToggle">🌙 Dark Mode</label>
        <input type="checkbox" id="darkModeToggle" checked>
      </div>
      <div class="setting-row">
        <label for="bufferSize">⏳ Buffer Size</label>
        <input type="range" id="bufferSize" min="10" max="120" value="30">
        <span class="range-value" id="bufferLabel">30s</span>
      </div>
      <div class="setting-row">
        <label for="autoReconnectToggle">🔄 Auto-Reconnect</label>
        <input type="checkbox" id="autoReconnectToggle" checked>
      </div>
      <div class="setting-row">
        <label for="eliseModeToggle">❤️ Elise Mode</label>
        <input type="checkbox" id="eliseModeToggle">
      </div>
      <button class="settings-close-btn" id="closeSettings">Close</button>
    </div>
  </div>

  <script type="module">
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  RESISTOR RADIO — Final with Modules
    //  SomaFM Indie Pop · For Elise
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // ─── IMPORTS ───
    import { loadTracklist, saveTracklist, addTrack } from './src/tracklist.js';
    import { loadLyricsCache, saveLyricsCache, fetchLyrics } from './src/lyrics.js';

    // ─── CONFIG ───
    const STREAM_URL = 'https://ice5.somafm.com/indiepop-32-aac';
    const SETTINGS_KEY = 'resistor_settings';
    const MAX_TRACKS = 200;

    // ─── DOM REFS ───
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('status');
    const liveBadge = document.getElementById('liveBadge');
    const volumeSlider = document.getElementById('volumeSlider');
    const nowPlaying = document.getElementById('nowPlaying');
    const tracklistToggle = document.getElementById('tracklistToggle');
    const tracklistHeader = document.getElementById('tracklistHeader');
    const tracklistItems = document.getElementById('tracklistItems');
    const trackCount = document.getElementById('trackCount');
    const tracklistArrow = document.getElementById('tracklistArrow');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const bufferSize = document.getElementById('bufferSize');
    const bufferLabel = document.getElementById('bufferLabel');
    const autoReconnectToggle = document.getElementById('autoReconnectToggle');
    const eliseModeToggle = document.getElementById('eliseModeToggle');
    const showLyricsBtn = document.getElementById('showLyricsBtn');
    const closeLyrics = document.getElementById('closeLyrics');
    const lyricsPanel = document.getElementById('lyricsPanel');
    const lyricsContent = document.getElementById('lyricsContent');

    // ─── STATE ───
    let isPlaying = false;
    let audio = null;
    let metadataTimer = null;
    let isTracklistOpen = false;
    let isEliseMode = false;
    let tracklist = [];
    let currentSong = { artist: '', title: '' };

    let settings = {
      darkMode: true,
      bufferSize: 30,
      autoReconnect: true,
      eliseMode: false
    };

    // ─── HELPERS ───
    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + type;
    }

    function updateUI(playing) {
      if (playing) {
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        liveBadge.textContent = '● Live';
        liveBadge.style.color = '#4ecdc4';
      } else {
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        liveBadge.textContent = '○ Paused';
        liveBadge.style.color = '#888';
      }
    }

    // ─── RENDER TRACKLIST ───
    function renderTracklist() {
      trackCount.textContent = tracklist.length;
      if (tracklist.length === 0) {
        tracklistItems.innerHTML = '<div style="padding:8px 0;color:var(--muted);font-size:12px;">No tracks yet.</div>';
        return;
      }
      let html = '';
      tracklist.forEach(t => {
        html += `<div class="track-item"><span>${t.artist} — ${t.title}</span><span class="count">${t.count}x</span></div>`;
      });
      tracklistItems.innerHTML = html;
    }

    // ─── UPDATE NOW PLAYING ───
    function updateNowPlaying(artist, title) {
      if (!artist || !title) return;
      if (currentSong.artist === artist && currentSong.title === title) return;

      currentSong.artist = artist;
      currentSong.title = title;
      artistEl.textContent = artist;
      titleEl.textContent = title;
      setStatus('🎵 Now playing', 'playing');

      // Add to tracklist using imported function
      tracklist = addTrack(tracklist, title, artist);
      saveTracklist(tracklist);
      renderTracklist();

      // Auto-show lyrics if Elise Mode is on
      if (isEliseMode) {
        displayLyrics(artist, title);
      }
    }

    // ─── METADATA FETCH ───
    async function fetchMetadata() {
      try {
        // Try songhistory.html first
        const response = await fetch('https://somafm.com/indiepop/songhistory.html', {
          signal: AbortSignal.timeout(8000)
        });
        if (response.ok) {
          const html = await response.text();
          const match = html.match(/<b>(.*?)<\/b>\s*-\s*<span>(.*?)<\/span>/);
          if (match) {
            updateNowPlaying(match[1].trim(), match[2].trim());
            return;
          }
        }

        // Fallback: ICY metadata
        const icyResponse = await fetch(STREAM_URL, {
          headers: { 'Icy-MetaData': '1' },
          signal: AbortSignal.timeout(5000)
        });
        if (icyResponse.ok) {
          const reader = icyResponse.body.getReader();
          const { value } = await reader.read();
          const chunk = new TextDecoder().decode(value);
          reader.releaseLock();
          const icyMatch = chunk.match(/StreamTitle='([^']+)'/);
          if (icyMatch) {
            const full = icyMatch[1].trim();
            if (full.includes(' - ')) {
              const parts = full.split(' - ', 2);
              updateNowPlaying(parts[0].trim(), parts[1].trim());
            }
          }
        }
      } catch (e) {
        console.debug('Metadata fetch error:', e.message);
      }
    }

    // ─── LYRICS DISPLAY ───
    async function displayLyrics(artist, title) {
      lyricsPanel.style.display = 'block';
      lyricsContent.innerHTML = '🔍 Searching...';

      const lyrics = await fetchLyrics(artist, title);
      if (lyrics) {
        const lines = lyrics.split('\n').filter(line => line.trim());
        let html = '';
        lines.forEach(line => {
          html += `<span class="line">${line}</span>`;
        });
        lyricsContent.innerHTML = html;
      } else {
        lyricsContent.innerHTML = '📝 No lyrics found.';
      }
    }

    // ─── AUDIO ───
    function createAudio() {
      if (audio) { audio.pause(); audio.src = ''; audio = null; }
      audio = new Audio();
      audio.src = STREAM_URL;
      audio.crossOrigin = 'anonymous';
      audio.preload = 'metadata';
      audio.setAttribute('decoding', 'async');
      audio.volume = parseFloat(volumeSlider.value);

      audio.addEventListener('playing', () => {
        isPlaying = true;
        updateUI(true);
        setStatus('🎵 Playing', 'playing');
        if (metadataTimer) clearInterval(metadataTimer);
        metadataTimer = setInterval(fetchMetadata, 10000);
        fetchMetadata();
      });

      audio.addEventListener('pause', () => {
        isPlaying = false;
        updateUI(false);
        setStatus('⏸ Paused', '');
        if (metadataTimer) { clearInterval(metadataTimer); metadataTimer = null; }
      });

      audio.addEventListener('error', () => {
        setStatus('❌ Stream error', 'error');
        isPlaying = false;
        updateUI(false);
      });

      return audio;
    }

    // ─── PLAYBACK ───
    function togglePlay() {
      if (!audio) audio = createAudio();
      if (isPlaying) {
        audio.pause();
      } else {
        audio.play().catch(() => setStatus('⚠️ Play error', 'error'));
      }
    }
    playBtn.addEventListener('click', togglePlay);

    // ─── VOLUME ───
    volumeSlider.addEventListener('input', () => { if (audio) audio.volume = parseFloat(volumeSlider.value); });

    // ─── TRACKLIST TOGGLE ───
    function toggleTracklist() {
      isTracklistOpen = !isTracklistOpen;
      tracklistItems.classList.toggle('open', isTracklistOpen);
      tracklistArrow.classList.toggle('open', isTracklistOpen);
    }
    tracklistHeader.addEventListener('click', toggleTracklist);
    tracklistToggle.addEventListener('click', toggleTracklist);

    // ─── LYRICS BUTTON ───
    showLyricsBtn.addEventListener('click', () => {
      const artist = artistEl.textContent;
      const title = titleEl.textContent;
      if (artist && title && artist !== 'SomaFM' && title !== 'Resistor') {
        displayLyrics(artist, title);
      } else {
        lyricsContent.innerHTML = '🎵 Play a track first.';
        lyricsPanel.style.display = 'block';
      }
    });
    closeLyrics.addEventListener('click', () => { lyricsPanel.style.display = 'none'; });

    // ─── COPY METADATA ───
    function copyMetadata() {
      const title = titleEl.textContent;
      const artist = artistEl.textContent;
      const text = `${title} — ${artist}`;
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          setStatus('📋 Copied!', '');
          setTimeout(() => setStatus('🎵 Now playing', 'playing'), 2000);
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    nowPlaying.addEventListener('click', copyMetadata);

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setStatus('📋 Copied!', '');
      setTimeout(() => setStatus('🎵 Now playing', 'playing'), 2000);
    }

    // ─── SETTINGS ───
    function loadSettings() {
      const stored = localStorage.getItem(SETTINGS_KEY);
      if (stored) { settings = JSON.parse(stored); applySettings(); }
    }

    function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

    function applySettings() {
      if (settings.darkMode) {
        document.documentElement.removeAttribute('data-theme');
        darkModeToggle.checked = true;
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        darkModeToggle.checked = false;
      }
      bufferSize.value = settings.bufferSize;
      bufferLabel.textContent = settings.bufferSize + 's';
      autoReconnectToggle.checked = settings.autoReconnect;
      eliseModeToggle.checked = settings.eliseMode;
      isEliseMode = settings.eliseMode;
    }

    function openSettings() { settingsModal.classList.add('open'); }
    function closeSettingsModal() { settingsModal.classList.remove('open'); }
    settingsToggle.addEventListener('click', openSettings);
    closeSettings.addEventListener('click', closeSettingsModal);
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettingsModal(); });

    darkModeToggle.addEventListener('change', () => { settings.darkMode = darkModeToggle.checked; applySettings(); saveSettings(); });
    bufferSize.addEventListener('input', () => { settings.bufferSize = parseInt(bufferSize.value); bufferLabel.textContent = settings.bufferSize + 's'; saveSettings(); });
    autoReconnectToggle.addEventListener('change', () => { settings.autoReconnect = autoReconnectToggle.checked; saveSettings(); });
    eliseModeToggle.addEventListener('change', () => {
      settings.eliseMode = eliseModeToggle.checked;
      isEliseMode = settings.eliseMode;
      saveSettings();
    });

    // ─── MEDIA SESSION ───
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Indie Pop', artist: 'SomaFM', album: 'Resistor Radio' });
      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
    }

    // ─── VISIBILITY ───
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && audio && isPlaying) {
        setStatus('🎵 Background', 'playing');
      } else if (!document.hidden && audio && isPlaying) {
        setStatus('🎵 Playing', 'playing');
      }
    });

    // ─── KEYBOARD ───
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName !== 'INPUT' && e.code === 'Space') { e.preventDefault(); togglePlay(); }
    });

    // ─── INIT ───
    loadSettings();
    tracklist = loadTracklist();
    loadLyricsCache();
    renderTracklist();
    setStatus('🎵 Ready', '');
    updateUI(false);
    console.log('🎸 Resistor Radio — For Elise');
  </script>
</body>
</html>
