<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resistor Radio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d1a;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --text: #fff;
      --muted: #888;
      --accent: #ff6b6b;
      --playing: #4ecdc4;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: -apple-system, system-ui, sans-serif;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .player {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 40px 32px 32px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .artwork { font-size: 72px; margin-bottom: 16px; display: block; }
    .now-playing { margin-bottom: 24px; min-height: 72px; }
    .now-playing h2 { color: var(--text); font-size: 20px; font-weight: 600; min-height: 28px; margin-bottom: 4px; }
    .now-playing .artist { color: var(--muted); font-size: 14px; }
    .play-btn {
      width: 72px; height: 72px; border-radius: 50%; border: none;
      background: var(--accent); color: white; font-size: 32px;
      cursor: pointer; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 20px rgba(255,107,107,0.3);
      touch-action: manipulation;
    }
    .play-btn:hover { transform: scale(1.05); }
    .play-btn:active { transform: scale(0.92); }
    .play-btn.playing { background: var(--playing); box-shadow: 0 4px 20px rgba(78,205,196,0.3); }
    .station-info { margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .badge {
      background: rgba(255,255,255,0.06); color: #aaa;
      padding: 4px 14px; border-radius: 20px; font-size: 11px;
    }
    .badge.accent { background: rgba(255,107,107,0.12); color: var(--accent); }
    .badge.playing-badge { background: rgba(78,205,196,0.12); color: var(--playing); }
    .status { color: #555; font-size: 12px; margin-top: 14px; min-height: 18px; }
    .status.error { color: var(--accent); }
    .status.playing { color: var(--playing); }
    .status.buffering { color: #f9a825; }
    .volume-wrap { margin-top: 16px; display: flex; align-items: center; gap: 10px; opacity: 0.4; transition: opacity 0.3s; }
    .volume-wrap:hover { opacity: 0.8; }
    .volume-wrap input[type="range"] { flex: 1; height: 3px; -webkit-appearance: none; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
    .volume-wrap input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
    .volume-icon { color: #666; font-size: 16px; width: 20px; }
    @media (max-width: 400px) { .player { padding: 28px 20px 24px; } .artwork { font-size: 56px; } .now-playing h2 { font-size: 17px; } .play-btn { width: 64px; height: 64px; font-size: 28px; } }
    @media (prefers-color-scheme: light) { :root { --bg: #f0f0f5; --card: rgba(255,255,255,0.6); --border: rgba(0,0,0,0.08); --text: #1a1a2e; --muted: #666; } }
    .control-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      color: var(--text);
    }
    .control-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="player">
    <span class="artwork" aria-hidden="true">🎸</span>
    <div class="now-playing">
      <h2 id="title">Resistor</h2>
      <p class="artist" id="artist">SomaFM Indie Pop</p>
    </div>
    <button class="play-btn" id="playBtn" aria-label="Play / Pause">▶</button>
    <div class="station-info">
      <span class="badge">SomaFM</span>
      <span class="badge accent">32k AAC</span>
      <span class="badge playing-badge" id="liveBadge">● Live</span>
    </div>
    <div class="status" id="status">Ready to play</div>
    <div class="volume-wrap">
      <span class="volume-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>
    <!-- Lyrics Section -->
    <!-- Controls -->
    <div class="controls">
      <button id="showLyricsBtn" class="control-btn" title="Show Lyrics">📜</button>
    </div>
    <div class="lyrics-panel" id="lyricsPanel">
      <div class="header">
        <span>📜 Lyrics</span>
        <span id="closeLyrics" style="cursor:pointer;">✕</span>
      </div>
      <div class="content" id="lyricsContent">
        <p style="color: var(--muted);">🎵 Play a track to see lyrics.</p>
      </div>
    </div>
  </div>
  <script>
    const STREAM_URL = 'https://ice1.somafm.com/indiepop-32-aac';
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('status');
    const liveBadge = document.getElementById('liveBadge');
    const volumeSlider = document.getElementById('volumeSlider');
    let isPlaying = false, audio = null, metadataTimer = null, reconnectAttempts = 0;
    const MAX_RECONNECT = 3;
    // ─── LYRICS UI ───
    const showLyricsBtn = document.getElementById('showLyricsBtn');
    const closeLyrics = document.getElementById('closeLyrics');
    const lyricsPanel = document.getElementById('lyricsPanel');
    const lyricsContent = document.getElementById('lyricsContent');

    async function displayLyrics(artist, title) {
      lyricsContent.innerHTML = '<p style="color: var(--muted);">🔍 Searching...</p>';
      lyricsPanel.style.display = 'block';

      const lyrics = await fetchLyrics(artist, title);
      if (lyrics) {
        const lines = lyrics.split('\n').filter(line => line.trim());
        let html = '';
        lines.forEach(line => {
          html += `<span class="line">${line}</span>`;
        });
        lyricsContent.innerHTML = html;
      } else {
        lyricsContent.innerHTML = '<p style="color: var(--muted);">📝 No lyrics found.</p>';
      }
    }

    showLyricsBtn.addEventListener('click', () => {
      const artist = artistEl.textContent;
      const title = titleEl.textContent;
      if (artist && title && artist !== 'SomaFM' && title !== 'Resistor') {
        displayLyrics(artist, title);
      } else {
        lyricsContent.innerHTML = '<p style="color: var(--muted);">🎵 Play a track first.</p>';
        lyricsPanel.style.display = 'block';
      }
    });

    closeLyrics.addEventListener('click', () => {
      lyricsPanel.style.display = 'none';
    });
    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + type;
    }

    function updateUI(playing) {
      if (playing) {
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        liveBadge.textContent = '● Live';
        liveBadge.style.color = '#4ecdc4';
      } else {
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        liveBadge.textContent = '○ Paused';
        liveBadge.style.color = '#888';
      }
    }

    async function fetchMetadata() {
      try {
        const response = await fetch(STREAM_URL, { headers: { 'Icy-MetaData': '1' }, signal: AbortSignal.timeout(5000) });
        const reader = response.body.getReader();
        const { value } = await reader.read();
        const chunk = new TextDecoder().decode(value);
        reader.releaseLock();
        const match = chunk.match(/StreamTitle='([^']+)'/);
        if (match) {
          const full = match[1].trim();
          if (full && full !== '') {
            if (full.includes(' - ')) {
              const parts = full.split(' - ', 2);
              artistEl.textContent = parts[0].trim() || 'SomaFM';
              titleEl.textContent = parts[1].trim() || '🎵 Resistor';
            } else {
              titleEl.textContent = full;
            }
            setStatus('🎵 Now playing', 'playing');
          }
        }
      } catch (e) { /* silent */ }
    }

    function createAudio() {
      if (audio) { audio.pause(); audio.src = ''; audio = null; }
      audio = new Audio();
      audio.src = STREAM_URL;
      audio.crossOrigin = 'anonymous';
      audio.preload = 'metadata';
      audio.setAttribute('decoding', 'async');
      audio.volume = parseFloat(volumeSlider.value);
      audio.addEventListener('playing', () => {
        isPlaying = true; updateUI(true); setStatus('🎵 Playing', 'playing'); reconnectAttempts = 0;
        if (metadataTimer) clearInterval(metadataTimer);
        metadataTimer = setInterval(fetchMetadata, 8000);
        fetchMetadata();
      });
      audio.addEventListener('pause', () => {
        isPlaying = false; updateUI(false); setStatus('⏸ Paused', '');
        if (metadataTimer) { clearInterval(metadataTimer); metadataTimer = null; }
      });
      audio.addEventListener('waiting', () => setStatus('⏳ Buffering...', 'buffering'));
      audio.addEventListener('stalled', () => setStatus('⏳ Loading...', 'buffering'));
      audio.addEventListener('error', () => {
        setStatus('❌ Connection error', 'error');
        if (reconnectAttempts < MAX_RECONNECT) {
          reconnectAttempts++;
          setTimeout(() => {
            if (audio && isPlaying) {
              setStatus(`🔄 Reconnecting (${reconnectAttempts}/${MAX_RECONNECT})...`, 'buffering');
              audio.load();
              audio.play().catch(() => {});
            }
          }, 2000 * reconnectAttempts);
        } else {
          setStatus('❌ Failed to connect', 'error');
          isPlaying = false; updateUI(false);
        }
      });
      audio.addEventListener('ended', () => { if (isPlaying) { audio.load(); audio.play().catch(() => {}); } });
      return audio;
    }

    function togglePlay() {
      if (!audio) audio = createAudio();
      if (isPlaying) audio.pause();
      else audio.play().catch(() => setStatus('⚠️ Play error', 'error'));
    }

    volumeSlider.addEventListener('input', () => { if (audio) audio.volume = parseFloat(volumeSlider.value); });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Indie Pop', artist: 'SomaFM', album: 'Resistor Radio' });
      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && audio && isPlaying) setStatus('🎵 Background', 'playing');
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName !== 'INPUT' && e.code === 'Space') { e.preventDefault(); togglePlay(); }
    });

    playBtn.addEventListener('click', togglePlay);
    setStatus('🎵 Ready', '');
    updateUI(false);
    console.log('🎸 Resistor Radio');
  </script>
</body>
</html>
